run_name: colony_cups_mit_b2
seed: 42

data:
  train_images: data/cups_dataset/images
  train_instances: data/cups_dataset/instances
  val_images: data/cups_dataset/images
  val_instances: data/cups_dataset/instances
  val_split: 0.2
  train_repeat: 8
  img_size: 512
  out_stride: 4

targets:
  boundary_thickness: 3
  sigma_min: 2.0
  sigma_max: 6.0

model:
  backbone_id: nvidia/mit-b2
  fpn_dim: 256

train:
  epochs: 30
  batch_size: 8
  num_workers: 4
  lr_head: 3.0e-4
  lr_backbone: 3.0e-5
  weight_decay: 1.0e-2
  amp: true
  freeze_backbone_epochs: 8
  iou_thr: 0.5
  loss_weights:
    sem: 1.0
    center: 0.5
    boundary: 1.5
  boundary_dice: 0.5

post:
  t_sem: 0.5
  t_center: 0.35
  min_distance: 6
  lambda_boundary: 3.0
  area_min: 20
  area_max: 20000
