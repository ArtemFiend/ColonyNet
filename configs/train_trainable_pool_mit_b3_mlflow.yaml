run_name: colony_trainable_pool_mit_b3_mlflow
seed: 42

data:
  train_images: trainable_pool/images
  train_instances: trainable_pool/instances
  val_images: trainable_pool/images
  val_instances: trainable_pool/instances
  val_split: 0.15
  train_repeat: 1
  img_size: 512
  out_stride: 4

targets:
  boundary_thickness: 3
  sigma_min: 2.0
  sigma_max: 6.0

model:
  model_variant: mit-b3
  backbone_id: nvidia/mit-b3
  fpn_dim: 256

train:
  epochs: 25
  batch_size: 4
  num_workers: 4
  lr_head: 3.0e-4
  lr_backbone: 3.0e-5
  weight_decay: 1.0e-2
  amp: true
  freeze_backbone_epochs: 8
  iou_thr: 0.5
  loss_weights:
    sem: 1.0
    center: 0.5
    boundary: 1.5
  boundary_dice: 0.5

post:
  t_sem: 0.5
  t_center: 0.35
  min_distance: 6
  lambda_boundary: 3.0
  area_min: 20
  area_max: 20000

mlflow:
  enabled: true
  tracking_uri: http://127.0.0.1:5000
  experiment: colony_segmentation
  run_name: colony_trainable_pool_mit_b3

test_seg:
  enabled: true
  image_path: test_seg/IMG_4677.jpg
  reference_path: test_seg/IMG_4677
  out_subdir: test_seg
  iou_thr: 0.5
  pad: 0.02
  mask_outside: true
  min_r_frac: 0.35
  max_r_frac: 0.55
  center_tol: 0.25
