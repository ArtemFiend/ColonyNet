run_name: smoke_trainable_pool_mit_b3
seed: 42
data:
  train_images: data/_smoke_subset/images
  train_instances: data/_smoke_subset/instances
  val_images: data/_smoke_subset/images
  val_instances: data/_smoke_subset/instances
  val_split: 0.25
  train_repeat: 1
  img_size: 512
  out_stride: 4
targets:
  boundary_thickness: 3
  sigma_min: 2.0
  sigma_max: 6.0
model:
  backbone_id: nvidia/mit-b3
  fpn_dim: 256
train:
  epochs: 1
  batch_size: 2
  num_workers: 0
  lr_head: 0.0003
  lr_backbone: 3.0e-05
  weight_decay: 0.01
  amp: false
  freeze_backbone_epochs: 0
  iou_thr: 0.5
  loss_weights:
    sem: 1.0
    center: 0.5
    boundary: 1.5
  boundary_dice: 0.5
post:
  t_sem: 0.5
  t_center: 0.35
  min_distance: 6
  lambda_boundary: 3.0
  area_min: 20
  area_max: 20000
