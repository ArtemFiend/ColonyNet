name: mlflow_mit_b2_two_stage
description: MLflow-ready two-stage training for mit-b2 (stage1 -> stage2).

stages:
  - name: mit_b2_stage1_pretrain
    type: train_config
    config: stage1_pretrain.yaml

  - name: mit_b2_stage2_finetune
    type: train_config
    config: stage2_finetune.yaml
    init_from_stage: mit_b2_stage1_pretrain
