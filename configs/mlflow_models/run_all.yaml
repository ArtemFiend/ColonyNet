name: mlflow_models_all
description: Run mit_b2/b3 (1-stage and 2-stage) and unetpp (1-stage and 2-stage notebook).

stages:
  - name: mit_b2_one_stage
    type: train_config
    config: mit_b2/one_stage.yaml

  - name: mit_b2_stage1_pretrain
    type: train_config
    config: mit_b2/stage1_pretrain.yaml

  - name: mit_b2_stage2_finetune
    type: train_config
    config: mit_b2/stage2_finetune.yaml
    init_from_stage: mit_b2_stage1_pretrain

  - name: mit_b3_one_stage
    type: train_config
    config: mit_b3/one_stage.yaml

  - name: mit_b3_stage1_pretrain
    type: train_config
    config: mit_b3/stage1_pretrain.yaml

  - name: mit_b3_stage2_finetune
    type: train_config
    config: mit_b3/stage2_finetune.yaml
    init_from_stage: mit_b3_stage1_pretrain

  - name: unetpp_one_stage
    type: notebook
    notebook: train_unified_unetpp.ipynb
    output_notebook: train_unified_unetpp.executed.ipynb
    timeout_sec: 0

  - name: unetpp_two_stage
    type: notebook
    notebook: train_two_stage_unetpp.ipynb
    output_notebook: train_two_stage_unetpp.executed.ipynb
    timeout_sec: 0
