name: all_train_configs
description: Run all main train.py config presets sequentially.

stages:
  - name: train_mit_b2
    type: train_config
    config: ../train_mit_b2.yaml

  - name: train_cups_mit_b2
    type: train_config
    config: ../train_cups_mit_b2.yaml

  - name: train_cups_mit_b3
    type: train_config
    config: ../train_cups_mit_b3.yaml

  - name: train_trainable_pool_mit_b2
    type: train_config
    config: ../train_trainable_pool_mit_b2.yaml

  - name: train_trainable_pool_mit_b3
    type: train_config
    config: ../train_trainable_pool_mit_b3.yaml

  - name: train_trainable_pool_mit_b3_edges_safe
    type: train_config
    config: ../train_trainable_pool_mit_b3_edges_safe.yaml

  - name: train_trainable_pool_mit_b3_edges_aggressive
    type: train_config
    config: ../train_trainable_pool_mit_b3_edges_aggressive.yaml

  - name: train_unified_mit_b2
    type: train_config
    config: ../train_unified_mit_b2.yaml

  - name: train_unified_mit_b3
    type: train_config
    config: ../train_unified_mit_b3.yaml

  - name: train_unified_petri_mit_b2
    type: train_config
    config: ../train_unified_petri_mit_b2.yaml

  - name: train_unified_petri_mit_b3
    type: train_config
    config: ../train_unified_petri_mit_b3.yaml

  - name: stage1_pretrain_no_cups
    type: train_config
    config: ../train_trainable_pool_stage1_pretrain_no_cups_mit_b3.yaml

  - name: stage2_finetune_cups
    type: train_config
    config: ../train_trainable_pool_stage2_finetune_cups_mit_b3.yaml
    init_from_stage: stage1_pretrain_no_cups
