name: two_stage_notebooks
description: Execute all train_two_stage notebooks sequentially.

stages:
  - name: two_stage_mit_b3_nb
    type: notebook
    notebook: train_two_stage_mit_b3.ipynb
    output_notebook: train_two_stage_mit_b3.executed.ipynb
    timeout_sec: 0

  - name: two_stage_unetpp_nb
    type: notebook
    notebook: train_two_stage_unetpp.ipynb
    output_notebook: train_two_stage_unetpp.executed.ipynb
    timeout_sec: 0

  - name: two_stage_mask2former_nb
    type: notebook
    notebook: train_two_stage_mask2former.ipynb
    output_notebook: train_two_stage_mask2former.executed.ipynb
    timeout_sec: 0

  - name: two_stage_hovernet_nb
    type: notebook
    notebook: train_two_stage_hovernet.ipynb
    output_notebook: train_two_stage_hovernet.executed.ipynb
    timeout_sec: 0

  - name: two_stage_cellpose_omnipose_nb
    type: notebook
    notebook: train_two_stage_cellpose_omnipose.ipynb
    output_notebook: train_two_stage_cellpose_omnipose.executed.ipynb
    timeout_sec: 0

  - name: two_stage_stardist_nb
    type: notebook
    notebook: train_two_stage_stardist.ipynb
    output_notebook: train_two_stage_stardist.executed.ipynb
    timeout_sec: 0
