run_name: colony_trainable_pool_mit_b3_edges_aggressive
seed: 42

data:
  train_images: trainable_pool/images
  train_instances: trainable_pool/instances
  val_images: trainable_pool/images
  val_instances: trainable_pool/instances
  val_split: 0.15
  train_repeat: 1
  img_size: 512
  out_stride: 4

targets:
  boundary_thickness: 5
  sigma_min: 2.0
  sigma_max: 6.0

model:
  backbone_id: nvidia/mit-b3
  fpn_dim: 256

train:
  epochs: 40
  batch_size: 4
  num_workers: 4
  lr_head: 3.0e-4
  lr_backbone: 3.0e-5
  weight_decay: 1.0e-2
  amp: true
  freeze_backbone_epochs: 8
  iou_thr: 0.5
  loss_weights:
    sem: 1.0
    center: 0.8
    boundary: 2.5
  boundary_dice: 1.0

post:
  t_sem: 0.45
  t_center: 0.25
  min_distance: 4
  lambda_boundary: 5.0
  area_min: 12
  area_max: 30000
