run_name: colony_mit_b2
seed: 42

data:
  train_images: data/dsb2018/images
  train_instances: data/dsb2018/instances
  val_images: data/dsb2018/images
  val_instances: data/dsb2018/instances
  val_split: 0.15
  img_size: 512
  out_stride: 4

model:
  backbone_id: nvidia/mit-b2
  fpn_dim: 256

train:
  epochs: 30
  batch_size: 6
  num_workers: 4
  lr_head: 3.0e-4
  lr_backbone: 3.0e-5
  weight_decay: 1.0e-2
  amp: true
  freeze_backbone_epochs: 8
  iou_thr: 0.5

post:
  t_sem: 0.5
  t_center: 0.35
  min_distance: 6
  lambda_boundary: 3.0
  area_min: 20
  area_max: 20000
