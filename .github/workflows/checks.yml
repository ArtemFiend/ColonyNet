name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m compileall -q src scripts examples tests
      - name: Run safeguards
        run: python -m unittest discover -s tests -v
      - name: Check repository hygiene
        run: python scripts/check_repository.py
