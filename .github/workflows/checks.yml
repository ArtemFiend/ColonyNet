name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python sources
        run: python -m compileall -q colonyseg full_pipline tools tests train.py infer.py
      - name: Test split isolation and filesystem safeguards
        run: python -m unittest discover -s tests -v
      - name: Check publication hygiene
        run: python tools/check_repository.py
