[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colonynet"
version = "1.0.0"
description = "Local Petri-dish colony segmentation and anomaly analysis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Artem Ponomarev"}]
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "opencv-python>=4.12,<5",
  "openpyxl>=3.1,<4",
  "pandas>=2.3,<3",
  "pillow>=12,<13",
  "scikit-image>=0.25,<1",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "tqdm>=4.67,<5",
  "ultralytics>=8.4.144,<9",
]

[project.scripts]
colonynet = "colonynet.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
colonynet = ["models/*.pt"]
